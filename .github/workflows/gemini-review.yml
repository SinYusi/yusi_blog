# Gemini CLI로 PR 코드 리뷰를 수행합니다.
# 공식 예제(google-github-actions/run-gemini-cli의 gemini-dispatch + pr-review)를 하나로 합치고,
# 리뷰 프롬프트는 프로젝트 전용 커맨드(.gemini/commands/yusi-review.toml)로 교체했습니다.
#
# 실행 조건
# - PR이 열리거나 다시 열리거나 draft에서 전환될 때 (fork PR 제외)
# - PR 코멘트가 "@gemini-cli /review"로 시작할 때 (OWNER, MEMBER, COLLABORATOR만)
#   예: "@gemini-cli /review 성능 위주로 봐줘"
name: Gemini Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.sender.type == 'User' &&
        startsWith(github.event.comment.body, '@gemini-cli /review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 코멘트 트리거(issue_comment)는 PR 정보를 담고 있지 않으므로, 직접 조회해 fork PR이면 중단합니다.
      - name: Reject fork pull requests
        if: github.event_name == 'issue_comment'
        run: |-
          head_repo="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}" --jq '.head.repo.full_name')"
          if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
            echo "::error::fork PR(${head_repo})에서는 리뷰를 실행하지 않습니다."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.issue.number }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Record start time
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"

      # 코멘트 본문은 스크립트에 직접 넣지 않고 환경 변수로만 전달합니다 (스크립트 인젝션 방지).
      - name: Build review arguments
        id: args
        run: |-
          request="${COMMENT_BODY#@gemini-cli /review}"
          {
            echo "value<<GEMINI_ARGS_EOF"
            echo "repository=${REPOSITORY} pr=${PULL_REQUEST_NUMBER}"
            echo "${request}"
            echo "GEMINI_ARGS_EOF"
          } >> "${GITHUB_OUTPUT}"
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          # 저장소 변수 GEMINI_DEBUG=true로 설정하면 상세 로그와 실행 결과 아티팩트를 남깁니다.
          gemini_debug: ${{ fromJSON(vars.GEMINI_DEBUG || false) }}
          upload_artifacts: ${{ vars.GEMINI_DEBUG || false }}
          workflow_name: gemini-review
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0@sha256:a1d43076a36638ee24520fd6e83c3905ae41bc9850179081df1de2ba3a7afae0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          # 프로젝트 전용 리뷰 커맨드: .gemini/commands/yusi-review.toml
          prompt: |-
            /yusi-review ${{ steps.args.outputs.value }}

      # 모델이 도구 호출에 실패해도 CLI는 성공으로 끝날 수 있으므로, 리뷰가 실제로 게시됐는지 확인합니다.
      - name: Verify review was posted
        run: |-
          count="$(gh api "repos/${REPOSITORY}/pulls/${PULL_REQUEST_NUMBER}/reviews" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and .submitted_at >= \"${STARTED_AT}\")] | length" \
            | jq -s 'add')"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::Gemini가 PR 리뷰를 게시하지 않았습니다. GEMINI_DEBUG=true로 다시 실행해 로그를 확인하세요."
            exit 1
          fi
          echo "게시된 리뷰: ${count}건"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          STARTED_AT: ${{ steps.start.outputs.time }}
